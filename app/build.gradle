plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fcai.smsapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.fcai.smsapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 只用系统自带 HttpURLConnection，无第三方依赖
}
