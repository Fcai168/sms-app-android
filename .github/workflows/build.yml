name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-app-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to GitHub Release（公开下载链接，免权限）
        run: |
          gh release create "apk-$(date +%Y%m%d-%H%M%S)" app/build/outputs/apk/debug/*.apk \
            --title "SmsApp APK $(date +%Y-%m-%d)" --generate-notes --prerelease -R Fcai168/sms-app-android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
