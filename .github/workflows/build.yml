name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-app-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to GitHub Release v101（公开下载链接，覆盖旧包）
        run: |
          if ! gh release view v101 -R Fcai168/sms-app-android >/dev/null 2>&1; then
            gh release create v101 --title "SmsApp v101" --prerelease -R Fcai168/sms-app-android
          fi
          cp app/build/outputs/apk/debug/app-debug.apk sms-app-v101.apk
          gh release upload v101 sms-app-v101.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
